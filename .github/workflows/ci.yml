name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Third-party actions are pinned by commit SHA, not by tag. A tag is mutable:
# whoever controls the action repository can repoint v6 at new code, which
# would execute in a job holding a token with packages:write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # Fast feedback: formatting and lint fail in seconds, before the slower
    # test and image jobs spend a runner on the same commit.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install ruff
        # Pinned to the version the working tree was verified against.
        # Formatting rules change between minor releases, so an unpinned ruff
        # turns a green local run into a red CI run for no code change.
        run: pip install -r requirements-dev.txt ruff

      - name: Lint
        run: ruff check --output-format=github .

      - name: Formatting
        run: ruff format --check --diff .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install CPU-only torch
        # On Linux the default PyPI wheel declares seven CUDA requirements
        # for a job with no GPU. Same constraint as the Dockerfile.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0

      - name: Install locked dependencies
        # requirements.lock pins the whole graph, torch excluded. Installing
        # from requirements*.txt let CI resolve transitive versions freshly,
        # which is how a build passes locally and fails here.
        run: |
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Verify committed artefacts are present
        # best_model.pt drives training and the parity test; model.npz is what
        # the container actually serves; reference.json is the drift baseline.
        # If either is missing from the checkout the suite does not fail, it
        # skips ~26 tests and reports green until the skip guard below trips,
        # which reads as a mysterious CI error rather than a missing file.
        run: |
          missing=0
          for f in outputs/best_model.pt outputs/model.npz outputs/reference.json; do
            if [ -f "$f" ]; then
              echo "ok      $f  ($(wc -c < "$f") bytes)"
            else
              echo "::error::$f is missing from the checkout. It is required by the"
              echo "::error::test suite and by the container image. Check it is committed"
              echo "::error::and not matched by .gitignore, then push it."
              missing=1
            fi
          done
          exit $missing

      - name: Fetch NAB data
        # Without this the split-integrity tests skip, and those are the
        # regression guards on the bug that made the original model useless.
        run: python scripts/fetch_data.py

      - name: Record the resolved environment
        # If a future run breaks, this pins down whether the environment moved.
        run: |
          python -c "import torch, fastapi, starlette; print('torch', torch.__version__); print('fastapi', fastapi.__version__); print('starlette', starlette.__version__)"
          pip check

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Verify no test was silently skipped
        # A skipped test reports green. The suite is meant to run in full in
        # CI, so a skip here means a fixture went missing, not that the check
        # was optional.
        run: |
          set -o pipefail
          pytest tests/ -q --no-header -rs 2>&1 | tee result.txt
          if grep -q "skipped" result.txt; then
            echo "::error::Tests were skipped in CI; they are all expected to run here."
            echo "The reason each test gave is below -- that reason is the actual fault:"
            grep -E "^SKIPPED" result.txt || grep -A100 "short test summary" result.txt || true
            exit 1
          fi

  docker:
    # Proves the image still builds on every change, so a broken Dockerfile is
    # caught here rather than at tag time when a release is already in motion.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: false
          load: true
          tags: chrono-sentinel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Smoke test the container
        # Building is not evidence the image runs. Start it, wait for
        # readiness, and score a real window.
        run: |
          docker run -d --name chrono -p 7860:7860 chrono-sentinel:ci
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:7860/readyz > /dev/null; then break; fi
            sleep 2
          done
          curl -sf http://127.0.0.1:7860/readyz > /dev/null || {
            echo "::error::Service never became ready"; docker logs chrono; exit 1;
          }
          echo "--- /readyz ---"
          curl -sf http://127.0.0.1:7860/readyz | tee readyz.json
          python3 -c "import json;assert json.load(open('readyz.json'))['ready'],'service not ready'"
          WINDOW=$(python3 -c "import json;print(json.load(open('readyz.json'))['window_size'])")
          echo "--- /score ---"
          python3 -c "
          import json, urllib.request
          n = $WINDOW
          body = json.dumps({'values': [85.0 + (i % 7) for i in range(n)]}).encode()
          req = urllib.request.Request('http://127.0.0.1:7860/score', data=body,
                                       headers={'Content-Type': 'application/json'})
          out = json.loads(urllib.request.urlopen(req).read())
          print(json.dumps(out, indent=2))
          assert 0.0 <= out['score'] <= 1.0
          assert out['uncertainty']['std'] > 0, 'uncertainty collapsed to zero'
          "
          echo "--- /metrics ---"
          curl -sf http://127.0.0.1:7860/metrics | grep -c chrono_

      - name: Report image size and runner disk
        # Cold start on free-tier hosts scales with image size, and a torch
        # image plus build cache is enough to fill a runner. Both are printed
        # so a size or space regression is visible in the log.
        if: always()
        run: |
          docker image ls chrono-sentinel:ci --format '{{.Repository}}:{{.Tag}}  {{.Size}}'
          echo "--- runner disk ---"
          df -h /

      - name: Container logs on failure
        if: failure()
        run: docker logs chrono || true
