name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Third-party actions are pinned by commit SHA, not by tag. A tag is mutable:
# whoever controls the action repository can repoint v6 at new code, which
# would execute in a job holding a token with packages:write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install CPU-only torch
        # The default PyPI wheel bundles CUDA: ~2.5 GB for a job that has no
        # GPU. Same constraint as the Dockerfile.
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0

      - name: Install dependencies
        run: |
          grep -v '^torch==' requirements.txt > requirements-notorch.txt
          pip install -r requirements-notorch.txt -r requirements-serve.txt -r requirements-dev.txt
          pip install -e . --no-deps

      - name: Fetch NAB data
        # Without this the split-integrity tests skip, and those are the
        # regression guards on the bug that made the original model useless.
        run: python scripts/fetch_data.py

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Verify no test was silently skipped
        # A skipped test reports green. The suite is meant to run in full in
        # CI, so a skip here means a fixture went missing, not that the check
        # was optional.
        run: |
          pytest tests/ -q --no-header -rs 2>&1 | tee result.txt
          if grep -q "skipped" result.txt; then
            echo "::error::Tests were skipped in CI; they are all expected to run."
            grep -A100 "short test summary" result.txt || true
            exit 1
          fi

  docker:
    # Proves the image still builds on every change, so a broken Dockerfile is
    # caught here rather than at tag time when a release is already in motion.
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          load: true
          tags: chrono-sentinel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        # Building is not evidence the image runs. Start it, wait for
        # readiness, and score a real window.
        run: |
          docker run -d --name chrono -p 7860:7860 chrono-sentinel:ci
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:7860/readyz > /dev/null; then break; fi
            sleep 2
          done
          echo "--- /readyz ---"
          curl -sf http://127.0.0.1:7860/readyz | tee readyz.json
          python -c "import json;assert json.load(open('readyz.json'))['ready'],'service not ready'"
          WINDOW=$(python -c "import json;print(json.load(open('readyz.json'))['window_size'])")
          echo "--- /score ---"
          python -c "
          import json, urllib.request
          n = $WINDOW
          body = json.dumps({'values': [85.0 + (i % 7) for i in range(n)]}).encode()
          req = urllib.request.Request('http://127.0.0.1:7860/score', data=body,
                                       headers={'Content-Type': 'application/json'})
          out = json.loads(urllib.request.urlopen(req).read())
          print(json.dumps(out, indent=2))
          assert 0.0 <= out['score'] <= 1.0
          assert out['uncertainty']['std'] > 0, 'uncertainty collapsed to zero'
          "
          echo "--- /metrics ---"
          curl -sf http://127.0.0.1:7860/metrics | grep -c chrono_

      - name: Report image size
        # Cold start on free-tier hosts scales with this, so keep it visible.
        run: docker image ls chrono-sentinel:ci --format '{{.Repository}}:{{.Tag}}  {{.Size}}'

      - name: Container logs on failure
        if: failure()
        run: docker logs chrono || true
