name: Release

# Builds and publishes the container image to GitHub Container Registry on
# every version tag. The published image is the deliverable: anyone can run
# the service with a single `docker run` against a public, immutable tag, so
# what a reader executes is exactly what CI built and tested.
on:
  push:
    tags:
      - "v*"

# Least privilege: the job needs to read the repository and write one package.
# It needs nothing else, and GITHUB_TOKEN is scoped accordingly rather than a
# long-lived personal access token being stored as a secret.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install CPU-only torch and locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Fetch NAB data
        run: python scripts/fetch_data.py

      - name: Run tests before publishing
        # A tag must not produce an image the test suite has not passed on.
        run: pytest tests/ -q

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        # GHCR rejects uppercase in a package path, and github.repository
        # preserves the repository's casing. metadata-action lowercases as a
        # convenience, but relying on that leaves the name it publishes under
        # implicit, and the README documents that exact string.
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          # latest=false is required: metadata-action tags :latest by default
          # on a semver push. The README pins a concrete tag so the artefact
          # is always identifiable, and a floating tag would make its measured
          # numbers unattributable to any specific image.
          flavor: |
            latest=false
          # {{version}} of a v0.2.2 git tag renders as 0.2.2, without the "v".
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Chrono-Sentinel
            org.opencontainers.image.description=Time-series anomaly detection with MC Dropout uncertainty
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Summarise the release
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "#### To deploy"
            echo "1. Make the GHCR package **public**: your profile -> Packages ->"
            echo "   chrono-sentinel -> Package settings -> Danger Zone ->"
            echo "   Change visibility -> Public. The Hugging Face Space builder is"
            echo "   unauthenticated and cannot pull a private image."
            echo "2. Update the \`FROM\` line in the Space's Dockerfile to this version tag."
            echo "3. The Space rebuilds and deploys this exact image."
          } >> "$GITHUB_STEP_SUMMARY"
