name: Release

# Builds and publishes the container image to GitHub Container Registry on
# every version tag. The Hugging Face Space then deploys that exact image via
# spaces/Dockerfile, so what runs in production is what CI built and tested,
# not a separate rebuild from source.
on:
  push:
    tags:
      - "v*"

# Least privilege: the job needs to read the repository and write one package.
# It needs nothing else, and GITHUB_TOKEN is scoped accordingly rather than a
# long-lived personal access token being stored as a secret.
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install CPU-only torch and locked dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.13.0
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Fetch NAB data
        run: python scripts/fetch_data.py

      - name: Run tests before publishing
        # A tag must not produce an image the test suite has not passed on.
        run: pytest tests/ -q

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute lowercase image name
        id: image
        # GHCR rejects uppercase in a package path, and github.repository
        # preserves the repository's casing. metadata-action lowercases as a
        # convenience, but relying on that leaves the name it publishes under
        # implicit -- and spaces/Dockerfile has to hardcode the same string.
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          # No :latest. spaces/Dockerfile pins a concrete tag so the deployed
          # artefact is always identifiable; a floating tag would make the
          # README's measured numbers unattributable to any specific image.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=long
          labels: |
            org.opencontainers.image.title=Chrono-Sentinel
            org.opencontainers.image.description=Time-series anomaly detection with MC Dropout uncertainty
            org.opencontainers.image.licenses=MIT

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Summarise the release
        run: |
          {
            echo "### Published"
            echo
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo
            echo "Digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "#### To deploy"
            echo "1. Make the GHCR package **public**: your profile -> Packages ->"
            echo "   chrono-sentinel -> Package settings -> Danger Zone ->"
            echo "   Change visibility -> Public. The Hugging Face Space builder is"
            echo "   unauthenticated and cannot pull a private image."
            echo "2. Update the \`FROM\` line in the Space's Dockerfile to this version tag."
            echo "3. The Space rebuilds and deploys this exact image."
          } >> "$GITHUB_STEP_SUMMARY"
